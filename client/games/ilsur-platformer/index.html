<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Ильсур — платформер</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="prototype" aria-label="Третья игра с Ильсуром">
      <header class="page-header">
        <div>
          <p class="eyebrow">ТРЕТЬЯ ИГРА · ПРОТОТИП</p>
          <h1>Большое приключение Ильсура</h1>
        </div>
        <a href="/">В каталог</a>
      </header>
      <p class="rotate-notice" role="status">Поверните телефон горизонтально</p>
      <section class="scene" aria-label="Игровой мир">
        <canvas
          id="scene"
          width="1200"
          height="540"
          aria-label="Временная сцена платформера с Ильсуром"
        >
          Для игры нужен браузер с поддержкой Canvas.
        </canvas>
      </section>
      <p class="prototype-note">
        Здесь пока простые фигуры. Управление и уровни появятся на следующих
        этапах.
      </p>
    </main>
  </body>
</html>
