<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Ильсур — платформер</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="prototype" aria-label="Третья игра с Ильсуром">
      <p class="rotate-notice" role="status">Поверните телефон горизонтально</p>
      <section class="scene" aria-label="Игровой мир">
        <canvas
          id="scene"
          width="960"
          height="540"
          aria-label="Игровой мир платформера с Ильсуром"
        >
          Для игры нужен браузер с поддержкой Canvas.
        </canvas>
      </section>
      <nav class="controls" aria-label="Управление игрой">
        <div class="control-cluster control-cluster--movement">
          <button
            type="button"
            data-action="left"
            aria-label="Влево"
            aria-pressed="false"
          >
            ◀
          </button>
          <button
            type="button"
            data-action="right"
            aria-label="Вправо"
            aria-pressed="false"
          >
            ▶
          </button>
          <button
            type="button"
            data-action="crouch"
            aria-label="Присесть"
            aria-pressed="false"
          >
            ▼
          </button>
        </div>
        <div class="control-cluster control-cluster--actions">
          <button
            type="button"
            data-action="shoot"
            aria-label="Стрелять"
            aria-pressed="false"
          >
            ■
          </button>
          <button
            type="button"
            data-action="jump"
            aria-label="Прыжок"
            aria-pressed="false"
          >
            ✕
          </button>
        </div>
      </nav>
      <output
        id="game-state"
        class="visually-hidden"
        aria-live="off"
        aria-hidden="true"
      ></output>
    </main>
  </body>
</html>
