<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Ильсур — платформер</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="prototype" aria-label="Третья игра с Ильсуром">
      <p class="rotate-notice" role="status">Поверните телефон горизонтально</p>
      <section class="scene" aria-label="Игровой мир">
        <div class="game-hud" aria-label="Состояние игры">
          <span id="level-name">Уровень 1</span>
          <span>Время <strong id="level-time">01:30</strong></span>
          <span>Жизни <strong id="lives">3</strong></span>
          <span id="checkpoint-name">Старт</span>
          <button id="pause" type="button" aria-label="Пауза">Ⅱ</button>
        </div>
        <canvas
          id="scene"
          width="960"
          height="540"
          aria-label="Игровой мир платформера с Ильсуром"
        >
          Для игры нужен браузер с поддержкой Canvas.
        </canvas>
      </section>
      <section id="campaign-overlay" class="campaign-overlay" hidden>
        <div
          class="campaign-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlay-title"
        >
          <h1 id="overlay-title"></h1>
          <p id="overlay-message"></p>
          <button id="resume" type="button" hidden>Вернуться на подиум</button>
          <button id="restart" type="button" hidden>Ещё попытка!</button>
          <a id="catalog" href="/" hidden>В каталог</a>
        </div>
      </section>
      <nav class="controls" aria-label="Управление игрой">
        <div class="control-cluster control-cluster--movement">
          <button
            type="button"
            data-action="left"
            aria-label="Влево"
            aria-pressed="false"
          >
            ◀
          </button>
          <button
            type="button"
            data-action="right"
            aria-label="Вправо"
            aria-pressed="false"
          >
            ▶
          </button>
          <button
            type="button"
            data-action="crouch"
            aria-label="Присесть"
            aria-pressed="false"
          >
            ▼
          </button>
        </div>
        <div class="control-cluster control-cluster--actions">
          <button
            type="button"
            data-action="shoot"
            aria-label="Стрелять"
            aria-pressed="false"
          >
            ■
          </button>
          <button
            type="button"
            data-action="jump"
            aria-label="Прыжок"
            aria-pressed="false"
          >
            ✕
          </button>
        </div>
      </nav>
      <output
        id="game-state"
        class="visually-hidden"
        aria-live="off"
        aria-hidden="true"
      ></output>
    </main>
  </body>
</html>
