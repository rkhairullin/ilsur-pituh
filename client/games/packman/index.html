<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ильсур-Пакман-Членоед</title>
    <link rel="stylesheet" href="./maze.css" />
  </head>
  <body>
    <main>
      <div class="rotate-notice" role="status">
        Поверните телефон вертикально, чтобы играть
      </div>
      <header>
        <h1>Ильсур-Пакман-Членоед</h1>
        <p class="stats">
          Членов напихано: <span id="caught">0</span> · Жизни:
          <span id="lives">5</span> · Карта: <span id="level">1</span>/7 · Круг:
          <span id="circle">1</span>
        </p>
        <div class="header-actions">
          <a href="/">Каталог</a>
          <button type="button" id="restart">Начать заново</button>
          <button
            type="button"
            id="sound"
            class="sound-toggle"
            aria-label="Выключить звук"
            aria-pressed="true"
            title="Выключить звук"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4Z" />
              <path
                class="sound-wave"
                d="M16 9a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"
              />
              <path class="sound-slash" d="m4 4 16 16" />
            </svg>
          </button>
        </div>
      </header>
      <section class="play" aria-label="Лабиринт">
        <div class="board-area">
          <div
            id="field"
            tabindex="0"
            aria-label="Игровое поле. Стрелки или WASD для движения"
          ></div>
        </div>
        <div class="controls" role="group" aria-label="Управление движением">
          <button type="button" data-direction="up" aria-label="Вверх">
            ↑
          </button>
          <button type="button" data-direction="left" aria-label="Влево">
            ←
          </button>
          <button type="button" data-direction="right" aria-label="Вправо">
            →
          </button>
          <button type="button" data-direction="down" aria-label="Вниз">
            ↓
          </button>
        </div>
      </section>
      <section class="overlay" id="lost" hidden aria-labelledby="lost-title">
        <h1 id="lost-title" lang="en">Gay over</h1>
        <p>Членов напихано: <b id="final-caught">0</b></p>
        <p>
          Круг: <b id="final-circle">1</b> · Раунд: <b id="final-round">1</b>
        </p>
        <p id="result-status" aria-live="polite"></p>
        <button id="retry-result" type="button" hidden>
          Повторить сохранение
        </button>
        <div class="header-actions result-actions">
          <a href="./rating">Рейтинг игры</a>
          <button type="button" id="play-again">Сыграть ещё</button>
          <a href="/">В каталог</a>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
